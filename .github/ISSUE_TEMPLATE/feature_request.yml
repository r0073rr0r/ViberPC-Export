name: 💡 Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please keep in mind this tool is strictly for
        accessing **your own** data on **your own** machine.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the motivation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request is about accessing my own data on my own machine only.
          required: true
