name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The tool targets Python 3.10+. Nothing in the code or in the
        # dependencies (frida >=3.7, sqlcipher3-wheels >=3.8) needs 3.10, but
        # pylint 4.x itself requires >=3.10, so the lint runs on 3.10 and up.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pylint==4.0.8"
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
